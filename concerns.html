<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Family concerns</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#111}
.wrap{max-width:900px;margin:0 auto;padding:40px 28px 70px}
h1{font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:400;font-size:40px;margin:0 0 6px}
.sub{color:#555;margin:0 0 22px;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;color:#777}
.top a{color:#7a5a12;cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tab{border:1.5px solid #ddd3bf;background:#fff;border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer}
.tab.on{border-color:#b8923a;background:#b8923a;color:#fff}
.card{background:#fff;border:1.5px solid #ddd3bf;border-radius:16px;padding:18px 20px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:18px}
.meta{font-size:13px;color:#777}
.det{margin:10px 0 0;font-size:15px;line-height:1.5;white-space:pre-wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.p-open{background:#f6ecd4;color:#7a5a12}.p-parked{background:#e9eef6;color:#2f4b78}.p-closed{background:#e4f1e6;color:#246b34}
.decision{margin-top:12px;background:#f3faf4;border:1px solid #cfe6d3;border-radius:10px;padding:10px 12px;font-size:15px}
.parked{margin-top:12px;background:#f2f5fa;border:1px solid #d6dfec;border-radius:10px;padding:10px 12px;font-size:15px}
.notes{margin-top:12px;border-top:1px solid #eee6d6;padding-top:10px}
.note{font-size:14px;margin:6px 0;line-height:1.45}
.note .w{color:#777;font-size:12px}
.note.change{color:#555;font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid #b8923a;background:#b8923a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#7a5a12}
button:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;color:#444;margin:10px 0 4px}
input[type=text],input[type=date],textarea{width:100%;font-size:15px;padding:9px 11px;border:1px solid #cfc6b2;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.form{margin-top:12px;background:#faf7f0;border:1px solid #eee6d6;border-radius:12px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:#777;font-size:15px;padding:20px 4px}
.msg{font-size:14px;margin-top:8px}.err{color:#a32d2d}
@media(max-width:640px){.grid2{grid-template-columns:1fr}h1{font-size:32px}.wrap{padding:28px 16px}}
@media print{.tabs,.row,.top,#addBox,.form,.notes{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← The Atrium</a><span id="who"></span></div>
  <div id="noaccess" style="display:none" class="card">This page is for the family only.</div>
  <div id="main" style="display:none">
    <h1>Family concerns</h1>
    <p class="sub">Anyone in the family can raise a concern here. Open concerns make the next meeting's agenda, oldest first. Each one is closed only once we write down what we decided.</p>

    <div class="tabs" id="tabs"></div>
    <div id="addBox" class="card">
      <h3>Raise a concern</h3>
      <label for="nt">What is it about?</label>
      <input id="nt" type="text" maxlength="160" placeholder="One line">
      <label for="nd">Details (optional)</label>
      <textarea id="nd" placeholder="What is happening, and what you would like us to decide"></textarea>
      <div class="row"><button id="addBtn">Add to the next meeting</button><span id="addMsg" class="msg"></span></div>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://jtfkpmvievetihhfdmqb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZmtwbXZpZXZldGloaGZkbXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODA1MTksImV4cCI6MjA5MTY1NjUxOX0.ozphoaGT7jVKr3NGmqQC1wMj5lp7MvVfdqO2HZWMl6k';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString('en-PH',{day:'numeric',month:'short',year:'numeric'}):'';
const today=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
let ROWS=[],NOTES=[],TAB='open',OPEN_FORM=null;

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  const email=session.user.email.toLowerCase();
  const {data:acc}=await sb.from('atrium_access').select('door_key').eq('email',email).eq('door_key','family');
  if(!acc||!acc.length){ $('noaccess').style.display='block'; return; }
  $('who').textContent='Signed in as '+email;
  $('main').style.display='block';
  await refresh();
}

async function refresh(){
  const [{data:r,error:e1},{data:n,error:e2}]=await Promise.all([
    sb.from('family_concerns').select('*').order('raised_at',{ascending:true}),
    sb.from('family_concern_notes').select('*').order('created_at',{ascending:true})
  ]);
  if(e1||e2){ $('list').innerHTML='<div class="card err">Could not load the list. Please reload.</div>'; return; }
  ROWS=r||[]; NOTES=n||[]; draw();
}

function draw(){
  const c=s=>ROWS.filter(x=>x.status===s).length;
  $('tabs').innerHTML=[['open','Open: next meeting'],['parked','Parked'],['closed','Decided']].map(([k,l])=>
    `<span class="tab ${TAB===k?'on':''}" onclick="TAB='${k}';OPEN_FORM=null;draw()">${l} (${c(k)})</span>`).join('')
    +`<span class="tab" onclick="window.print()">Print this list</span>`;
  $('addBox').style.display=TAB==='open'?'block':'none';
  let list=ROWS.filter(x=>x.status===TAB);
  if(TAB==='closed') list=list.slice().sort((a,b)=>String(b.closed_at).localeCompare(String(a.closed_at)));
  if(!list.length){ $('list').innerHTML=`<div class="empty">${TAB==='open'?'Nothing open. Raise a concern above.':'Nothing here yet.'}</div>`; return; }
  $('list').innerHTML=list.map((x,i)=>card(x,TAB==='open'?i+1:null)).join('');
}

function card(x,num){
  const notes=NOTES.filter(n=>n.concern_id===x.id);
  const pill=`<span class="pill p-${x.status}">${{open:'Open',parked:'Parked',closed:'Decided'}[x.status]}</span>`;
  let body=`<h3>${num?num+'. ':''}${esc(x.title)}${pill}</h3>
    <div class="meta">Raised by ${esc(x.raised_by_name)} · ${fmt(x.raised_at)}</div>
    ${x.details?`<div class="det">${esc(x.details)}</div>`:''}`;
  if(x.status==='closed') body+=`<div class="decision"><b>Decided${x.meeting_date?' at the meeting of '+fmt(x.meeting_date):''}:</b> ${esc(x.decision)}
      ${x.action_owner?`<div class="meta" style="margin-top:4px">Next step with ${esc(x.action_owner)}${x.due_date?' · by '+fmt(x.due_date):''}</div>`:''}
      <div class="meta">Recorded by ${esc(x.closed_by_name||'')} · ${fmt(x.closed_at)}</div></div>`;
  if(x.status==='parked') body+=`<div class="parked"><b>Parked:</b> ${esc(x.parked_reason)}</div>`;
  if(notes.length) body+=`<div class="notes">${notes.map(n=>`<div class="note ${n.kind}"><span class="w">${esc(n.author_name)} · ${fmt(n.created_at)}</span><br>${esc(n.body)}</div>`).join('')}</div>`;
  const f=OPEN_FORM&&OPEN_FORM.id===x.id?OPEN_FORM.kind:null;
  if(f==='decide') body+=`<div class="form">
      <label>What did we decide?</label><textarea id="f_dec"></textarea>
      <div class="grid2"><div><label>Next step with (optional)</label><input id="f_own" type="text" placeholder="Who does it"></div>
      <div><label>By when (optional)</label><input id="f_due" type="date"></div></div>
      <label>Meeting date</label><input id="f_mtg" type="date" value="${today()}" style="max-width:220px">
      <div class="row"><button onclick="decide(${x.id})">Save and close</button><button class="ghost" onclick="OPEN_FORM=null;draw()">Cancel</button><span id="f_msg" class="msg"></span></div></div>`;
  else if(f==='park') body+=`<div class="form"><label>Why are we parking it, and when do we come back to it?</label><textarea id="f_park"></textarea>
      <div class="row"><button onclick="park(${x.id})">Park it</button><button class="ghost" onclick="OPEN_FORM=null;draw()">Cancel</button><span id="f_msg" class="msg"></span></div></div>`;
  else if(f==='note') body+=`<div class="form"><label>Your comment</label><textarea id="f_note"></textarea>
      <div class="row"><button onclick="addNote(${x.id})">Add comment</button><button class="ghost" onclick="OPEN_FORM=null;draw()">Cancel</button><span id="f_msg" class="msg"></span></div></div>`;
  else body+=`<div class="row">${x.status!=='closed'?`<button onclick="openForm(${x.id},'decide')">Record the decision</button>`:''}
      ${x.status==='open'?`<button class="ghost" onclick="openForm(${x.id},'park')">Park it</button>`:''}
      ${x.status!=='open'?`<button class="ghost" onclick="setStatus(${x.id},'open')">${x.status==='closed'?'Reopen':'Back to the next meeting'}</button>`:''}
      <button class="ghost" onclick="openForm(${x.id},'note')">Comment</button></div>`;
  return `<div class="card">${body}</div>`;
}

function openForm(id,kind){ OPEN_FORM={id,kind}; draw(); }
function fail(e){ const m=$('f_msg'); if(m){ m.className='msg err'; m.textContent='That did not save. '+(e&&e.message?'':'Please try again.'); } }

$('addBtn').onclick=async()=>{
  const t=$('nt').value.trim(), d=$('nd').value.trim(), m=$('addMsg');
  if(t.length<3){ m.className='msg err'; m.textContent='Write a line saying what it is about.'; return; }
  $('addBtn').disabled=true;
  const {error}=await sb.from('family_concerns').insert({title:t,details:d||null});
  $('addBtn').disabled=false;
  if(error){ m.className='msg err'; m.textContent='That did not save. Please try again.'; return; }
  $('nt').value=''; $('nd').value=''; m.className='msg'; m.textContent='Added.'; await refresh();
};

async function decide(id){
  const dec=$('f_dec').value.trim();
  if(dec.length<3){ $('f_msg').className='msg err'; $('f_msg').textContent='Write down what was decided first.'; return; }
  const {error}=await sb.from('family_concerns').update({status:'closed',decision:dec,action_owner:$('f_own').value.trim()||null,
    due_date:$('f_due').value||null,meeting_date:$('f_mtg').value||null,parked_reason:null}).eq('id',id);
  if(error) return fail(error); OPEN_FORM=null; await refresh();
}
async function park(id){
  const r=$('f_park').value.trim();
  if(r.length<3){ $('f_msg').className='msg err'; $('f_msg').textContent='Write why it is parked.'; return; }
  const {error}=await sb.from('family_concerns').update({status:'parked',parked_reason:r}).eq('id',id);
  if(error) return fail(error); OPEN_FORM=null; await refresh();
}
async function setStatus(id,s){
  const {error}=await sb.from('family_concerns').update({status:s,parked_reason:null}).eq('id',id);
  if(error){ alert('That did not save. Please try again.'); return; } await refresh();
}
async function addNote(id){
  const b=$('f_note').value.trim(); if(!b) return;
  const {error}=await sb.from('family_concern_notes').insert({concern_id:id,body:b,kind:'comment'});
  if(error) return fail(error); OPEN_FORM=null; await refresh();
}
load();
</script>
</body>
</html>
