<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Atrium</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#111}
.wrap{max-width:1040px;margin:0 auto;padding:56px 36px}
h1{font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:400;font-size:44px;margin:0 0 36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.door{background:#fff;border:1.5px solid #ddd3bf;border-radius:18px;padding:26px;display:flex;align-items:center;gap:26px;text-decoration:none;color:inherit;cursor:pointer}
.door:hover{border-color:#b8923a}
.door.soon{cursor:default;opacity:.55}
.door.soon:hover{border-color:#ddd3bf}
.logo{width:120px;height:120px;border-radius:16px;border:1px solid #e6dfcf;overflow:hidden;flex:none;background:#fff}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.name{font-size:28px;font-weight:700}
.what{color:#333;font-size:16px;margin-top:8px}
.soonnote{display:inline-block;margin-top:10px;font-size:13px;color:#7a5a12;background:#f6ecd4;border-radius:999px;padding:3px 12px}
.card{background:#fff;border:1.5px solid #ddd3bf;border-radius:18px;padding:30px;max-width:440px}
label{display:block;font-size:14px;color:#444;margin-bottom:6px}
input[type=email],input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid #cfc6b2;border-radius:10px;background:#fff}
button{font-size:15px;padding:10px 18px;border-radius:10px;border:1px solid #b8923a;background:#b8923a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#7a5a12}
.msg{font-size:14px;color:#444;margin-top:14px;line-height:1.5}
.err{color:#a32d2d}
.foot{margin-top:40px;font-size:13px;color:#777;display:flex;gap:16px;align-items:center}
.foot a{color:#7a5a12;cursor:pointer;text-decoration:underline}
#admin{margin-top:48px}
#admin h2{font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:400;font-size:28px;margin:0 0 6px}
#admin .sub{font-size:14px;color:#555;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid #ddd3bf;border-radius:14px;overflow:hidden;font-size:15px}
th,td{padding:12px 10px;border-bottom:1px solid #eee6d4;text-align:center;vertical-align:top}
th{font-weight:600;color:#555;background:#faf7f0}
td:first-child,th:first-child{text-align:left}
.parts{display:block;width:100%;margin-top:6px;font-size:12px;padding:5px 7px;border:1px solid #e1d8c4;border-radius:7px;color:#333}
.addrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.addrow input{flex:1;min-width:180px}
.log{margin-top:18px;font-size:12px;color:#666;line-height:1.6;max-height:180px;overflow:auto;background:#fff;border:1px solid #eee6d4;border-radius:10px;padding:10px 12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:32px 18px}h1{font-size:34px}.logo{width:84px;height:84px}.name{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="signin" style="display:none">
    <h1>Welcome</h1>
    <div class="card">
      <label for="email">Your email</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@hassarams.com">
      <div style="margin-top:14px"><button id="sendBtn">Email me a sign-in link</button></div>
      <div id="signinMsg" class="msg"></div>
    </div>
  </div>

  <div id="home" style="display:none">
    <h1 id="greet"></h1>
    <div class="grid" id="doors"></div>
    <div id="admin" style="display:none">
      <h2>Who has access</h2>
      <div class="sub">Tick a door to give it, untick to take it away. The small box says what they get inside that door. Saved as you go.</div>
      <div id="adminTable"></div>
      <div class="addrow">
        <input id="newEmail" type="email" placeholder="Their email">
        <input id="newName" type="text" placeholder="Name on their greeting (e.g. Sanj)">
        <button id="addBtn" class="ghost">Add person</button>
      </div>
      <div id="adminMsg" class="msg"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="foot"><span id="who"></span><a id="signout">Sign out</a></div>
  </div>

  <div id="noaccess" style="display:none">
    <h1>Welcome</h1>
    <div class="card"><div class="msg">This email has no doors yet. Please ask Anj.</div>
    <div style="margin-top:14px"><button class="ghost" id="signout2">Sign out</button></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://xweuafsvkrjjyailxjsy.supabase.co';
const SB_KEY = 'sb_publishable_RyV4m3as6f91En3b4owEpQ_clHjuNqF';
const LOGOS = {rcc:'img/rcc.png', chatlani:'img/chatlani.png', genoglo:'img/genoglo.svg', chummy:'img/chummy.png'};
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const show = id => ['signin','home','noaccess'].forEach(x => $(x).style.display = x === id ? 'block' : 'none');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hello(name){
  const h = new Date().getHours();
  return (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + name;
}

$('sendBtn').onclick = async () => {
  const email = $('email').value.trim().toLowerCase();
  const m = $('signinMsg');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { m.className = 'msg err'; m.textContent = 'Enter your email first.'; return; }
  $('sendBtn').disabled = true; m.className = 'msg'; m.textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
  $('sendBtn').disabled = false;
  if (error) { m.className = 'msg err'; m.textContent = 'That did not go through: ' + error.message; return; }
  m.textContent = 'Check your email and press the link. It opens this page signed in.';
};

async function signOut(){ await sb.auth.signOut(); location.replace(location.pathname); }
$('signout').onclick = signOut; $('signout2').onclick = signOut;

async function load(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('signin'); return; }
  const email = session.user.email.toLowerCase();
  const [{ data: me }, { data: ownerRows }, { data: acc }, { data: doors }] = await Promise.all([
    sb.from('people').select('*').eq('email', email).maybeSingle(),
    sb.from('owners').select('email'),
    sb.from('access').select('*').eq('email', email),
    sb.from('doors').select('*').order('sort')
  ]);
  const isOwner = (ownerRows || []).some(r => r.email.toLowerCase() === email);
  const mine = (doors || []).filter(d => (acc || []).some(a => a.door_key === d.key));
  if (!me || !mine.length) { show('noaccess'); return; }
  if (!isOwner && mine.length === 1 && !mine[0].owner_only_for_now) { location.replace(mine[0].url); return; }

  $('greet').textContent = hello(me.greet_name);
  $('who').textContent = 'Signed in as ' + email;
  $('doors').innerHTML = mine.map(d => {
    const soon = d.owner_only_for_now && !isOwner;
    const inner = `<div class="logo"><img src="${LOGOS[d.key] || ''}" alt=""></div>
      <div><div class="name">${esc(d.name)}</div><div class="what">${esc(d.tagline)}</div>
      ${soon ? '<div class="soonnote">Being set up</div>' : ''}</div>`;
    return soon ? `<div class="door soon">${inner}</div>` : `<a class="door" href="${esc(d.url)}">${inner}</a>`;
  }).join('');
  show('home');
  if (isOwner) { $('admin').style.display = 'block'; drawAdmin(doors); }
}

async function drawAdmin(doors){
  const [{ data: people }, { data: acc }, { data: log }] = await Promise.all([
    sb.from('people').select('*').order('greet_name'),
    sb.from('access').select('*'),
    sb.from('change_log').select('*').order('at', { ascending: false }).limit(20)
  ]);
  const has = (e, k) => (acc || []).find(a => a.email === e && a.door_key === k);
  let h = '<table><tr><th>Person</th>' + doors.map(d => `<th>${esc(d.name)}</th>`).join('') + '</tr>';
  for (const p of people || []) {
    h += `<tr><td><b>${esc(p.greet_name)}</b><br><span style="font-size:12px;color:#777">${esc(p.email)}</span></td>`;
    for (const d of doors) {
      const a = has(p.email, d.key);
      h += `<td><input type="checkbox" data-e="${esc(p.email)}" data-k="${d.key}" ${a ? 'checked' : ''}>` +
        (a ? `<input class="parts" data-e="${esc(p.email)}" data-k="${d.key}" value="${esc(a.parts || '')}" placeholder="What inside?">` : '') + '</td>';
    }
    h += '</tr>';
  }
  $('adminTable').innerHTML = h + '</table>';
  $('log').innerHTML = (log || []).map(l => `${new Date(l.at).toLocaleString()} · ${esc(l.by_email || '')} · ${esc(l.what.slice(0, 160))}`).join('<br>') || 'No changes yet.';

  document.querySelectorAll('#adminTable input[type=checkbox]').forEach(cb => cb.onchange = async () => {
    const e = cb.dataset.e, k = cb.dataset.k;
    const r = cb.checked
      ? await sb.from('access').insert({ email: e, door_key: k })
      : await sb.from('access').delete().eq('email', e).eq('door_key', k);
    if (r.error) { $('adminMsg').className = 'msg err'; $('adminMsg').textContent = r.error.message; cb.checked = !cb.checked; return; }
    drawAdmin(doors);
  });
  document.querySelectorAll('#adminTable input.parts').forEach(inp => inp.onchange = async () => {
    const r = await sb.from('access').update({ parts: inp.value.trim() || null }).eq('email', inp.dataset.e).eq('door_key', inp.dataset.k);
    $('adminMsg').className = r.error ? 'msg err' : 'msg';
    $('adminMsg').textContent = r.error ? r.error.message : 'Saved.';
  });
  $('addBtn').onclick = async () => {
    const e = $('newEmail').value.trim().toLowerCase(), n = $('newName').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e) || !n) { $('adminMsg').className = 'msg err'; $('adminMsg').textContent = 'Enter their email and the name for their greeting.'; return; }
    const r = await sb.from('people').insert({ email: e, greet_name: n });
    if (r.error) { $('adminMsg').className = 'msg err'; $('adminMsg').textContent = r.error.message; return; }
    $('newEmail').value = ''; $('newName').value = '';
    $('adminMsg').className = 'msg'; $('adminMsg').textContent = 'Added. Tick their doors above.';
    drawAdmin(doors);
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') load(); });
load();
</script>
</body>
</html>
