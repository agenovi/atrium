<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Atrium</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#111}
.wrap{max-width:1040px;margin:0 auto;padding:56px 36px}
h1{font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:400;font-size:44px;margin:0 0 36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.door{background:#fff;border:1.5px solid #ddd3bf;border-radius:18px;padding:26px;display:flex;align-items:center;gap:26px;text-decoration:none;color:inherit;cursor:pointer}
.door:hover{border-color:#b8923a}
.door.soon{cursor:default;opacity:.55}
.door.soon:hover{border-color:#ddd3bf}
.logo{width:120px;height:120px;border-radius:16px;border:1px solid #e6dfcf;overflow:hidden;flex:none;background:#fff}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.name{font-size:28px;font-weight:700}
.what{color:#333;font-size:16px;margin-top:8px}
.soonnote{display:inline-block;margin-top:10px;font-size:13px;color:#7a5a12;background:#f6ecd4;border-radius:999px;padding:3px 12px}
.card{background:#fff;border:1.5px solid #ddd3bf;border-radius:18px;padding:30px;max-width:440px}
label{display:block;font-size:14px;color:#444;margin-bottom:6px}
input[type=email],input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid #cfc6b2;border-radius:10px;background:#fff}
button{font-size:15px;padding:10px 18px;border-radius:10px;border:1px solid #b8923a;background:#b8923a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#7a5a12}
.msg{font-size:14px;color:#444;margin-top:14px;line-height:1.5}
.err{color:#a32d2d}
.foot{margin-top:40px;font-size:13px;color:#777;display:flex;gap:16px;align-items:center}
.foot a{color:#7a5a12;cursor:pointer;text-decoration:underline}
@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:32px 18px}h1{font-size:34px}.logo{width:84px;height:84px}.name{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="signin" style="display:none">
    <h1>Welcome</h1>
    <div class="card">
      <label for="email">Your email</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@hassarams.com">
      <label for="pw" style="margin-top:12px">Password (same as the HR portal)</label>
      <input id="pw" type="password" autocomplete="current-password" style="width:100%;font-size:16px;padding:10px 12px;border:1px solid #cfc6b2;border-radius:10px">
      <div style="margin-top:14px"><button id="sendBtn">Sign in</button></div>
      <div id="signinMsg" class="msg">Forgot it? Use "Forgot your password" on the HR portal sign-in page.</div>
    </div>
  </div>

  <div id="home" style="display:none">
    <div id="previewBar" style="display:none;background:#f6ecd4;color:#7a5a12;border-radius:10px;padding:8px 14px;font-size:13px;margin-bottom:18px">Preview only · <a href="access.html" style="color:#7a5a12">back to Who has access</a></div>
    <h1 id="greet"></h1>
    <div class="grid" id="doors"></div>
    <div class="foot"><span id="who"></span><a id="manage" href="access.html" style="display:none">Manage access</a><a id="signout">Sign out</a></div>
  </div>

  <div id="noaccess" style="display:none">
    <h1>Welcome</h1>
    <div class="card"><div class="msg">This email has no doors yet. Please ask Anj.</div>
    <div style="margin-top:14px"><button class="ghost" id="signout2">Sign out</button></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://jtfkpmvievetihhfdmqb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZmtwbXZpZXZldGloaGZkbXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODA1MTksImV4cCI6MjA5MTY1NjUxOX0.ozphoaGT7jVKr3NGmqQC1wMj5lp7MvVfdqO2HZWMl6k';
const LOGOS = {rcc:'img/rcc.png', chatlani:'img/chatlani.png', genoglo:'img/genoglo.svg', chummy:'img/chummy.png'};
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const show = id => ['signin','home','noaccess'].forEach(x => $(x).style.display = x === id ? 'block' : 'none');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hello(name){
  const h = new Date().getHours();
  return (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + name;
}

$('sendBtn').onclick = async () => {
  const email = $('email').value.trim().toLowerCase(), password = $('pw').value;
  const m = $('signinMsg');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !password) { m.className = 'msg err'; m.textContent = 'Enter your email and password.'; return; }
  $('sendBtn').disabled = true; m.className = 'msg'; m.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('sendBtn').disabled = false;
  if (error) { m.className = 'msg err'; m.textContent = 'That did not work. Check your email and password.'; return; }
  load();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('sendBtn').click(); });

async function signOut(){ await sb.auth.signOut(); location.replace(location.pathname); }
$('signout').onclick = signOut; $('signout2').onclick = signOut;

async function load(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('signin'); return; }
  const email = session.user.email.toLowerCase();
  const [{ data: me }, { data: ownerRows }, { data: acc }, { data: doors }] = await Promise.all([
    sb.from('atrium_people').select('*').eq('email', email).maybeSingle(),
    sb.from('atrium_owners').select('email'),
    sb.from('atrium_access').select('*').eq('email', email),
    sb.from('atrium_doors').select('*').order('sort')
  ]);
  const isOwner = (ownerRows || []).some(r => r.email.toLowerCase() === email);
  const asEmail = isOwner ? (new URLSearchParams(location.search).get('as') || '').toLowerCase() : '';
  if (asEmail && asEmail !== email) {
    const [{ data: them }, { data: theirAcc }] = await Promise.all([
      sb.from('atrium_people').select('*').eq('email', asEmail).maybeSingle(),
      sb.from('atrium_access').select('*').eq('email', asEmail)
    ]);
    const theirs = (doors || []).filter(d => (theirAcc || []).some(a => a.door_key === d.key));
    $('greet').textContent = hello(them ? them.greet_name : asEmail);
    $('who').textContent = 'Preview of what ' + (them ? them.greet_name : asEmail) + ' sees' + (theirs.length === 1 ? ' (one door: they go straight in, without this page)' : '');
    $('previewBar').style.display = 'block';
    drawDoors(theirs, false);
    show('home');
    return;
  }
  const mine = (doors || []).filter(d => (acc || []).some(a => a.door_key === d.key));
  if (!me || !mine.length) { show('noaccess'); return; }
  if (!isOwner && mine.length === 1 && !mine[0].owner_only_for_now) { location.replace(mine[0].url); return; }

  $('greet').textContent = hello(me.greet_name);
  $('who').textContent = 'Signed in as ' + email;
  drawDoors(mine, isOwner);
  show('home');
  if (isOwner) $('manage').style.display = 'inline';
}

function drawDoors(list, isOwner){
  $('doors').innerHTML = list.map(d => {
    const soon = d.owner_only_for_now && !isOwner;
    const inner = `<div class="logo"><img src="${LOGOS[d.key] || ''}" alt=""></div>
      <div><div class="name">${esc(d.name)}</div><div class="what">${esc(d.tagline)}</div>
      ${soon ? '<div class="soonnote">Being set up</div>' : ''}</div>`;
    return soon ? `<div class="door soon">${inner}</div>` : `<a class="door" href="${esc(d.url)}">${inner}</a>`;
  }).join('');
}

load();
</script>
</body>
</html>
